---
extends: default
ignore-from-file:
  - .gitignore
  - .yamllint-ignore
rules:
  document-start: disable
  octal-values: enable
  truthy:
    ignore: |
      .github/workflows/*.yaml
      .github/workflows/*.yml
  line-length: disable
  indentation:
    check-multi-line-strings: false
    indent-sequences: consistent
  brackets:
    max-spaces-inside: 1
    max-spaces-inside-empty: 0
