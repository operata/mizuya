name: Push artifact
# Knope's `release` workflow creates the GitHub release and the `v*` tag.
# That tag push lands here: build the Pkl package and attach it to the release
# Knope already created.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  push-artifact:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5
        with:
          cache: false

      - name: Verify tag matches PklProject version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version=$(pkl eval -x 'package.version' PklProject)
          if [ "$GIT_TAG" != "v$version" ]; then
            echo "Git tag '$GIT_TAG' does not match PklProject version 'v$version'" >&2
            exit 1
          fi

      - run: pkl project package

      - name: Upload package assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ github.ref_name }}
        run: gh release upload "$GIT_TAG" .out/*/*
