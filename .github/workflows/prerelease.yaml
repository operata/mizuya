name: Prerelease
# Manually cut an alpha/beta/rc of the Pkl package from main. Knope computes
# the version; the tag push then triggers push-artifact.yaml, which builds and
# uploads the package to the pre-release. Nothing is committed to the source branch.
on:
  workflow_dispatch:
    inputs:
      label:
        description: Pre-release label
        type: choice
        options:
          - alpha
          - beta
          - rc
        default: rc
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  prerelease:
    # Prereleases are only cut from main, never from feature or throwaway branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Mint GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-metadata: read
      - name: Configure git identity
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5
        with:
          cache: false
      - name: Create pre-release
        run: .github/scripts/prerelease.sh "$PRERELEASE_LABEL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRERELEASE_LABEL: ${{ inputs.label }}
