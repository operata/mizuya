name: Release
# When the Knope "release" PR is merged into main, create the GitHub release
# and the v* tag. The tag push then triggers push-artifact.yaml, which builds
# and uploads the Pkl package.
on:
  pull_request:
    types: [closed]
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Least privilege for the default token: it only checks the repo out (read).
# The release itself is created with the minted operata-release-bot App token
# below, so the tag it creates triggers push-artifact.yaml. A tag created with
# the default GITHUB_TOKEN would NOT trigger that downstream workflow.
permissions:
  contents: read
jobs:
  release:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Mint GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-metadata: read
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5
        with:
          cache: false
      - name: Create release and tag
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
