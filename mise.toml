min_version = "2026.10.8"

[tools]
editorconfig-checker = "4.0.2"
"github:owenlamont/ryl" = "0.28.0"                    # lints & auto-fixes YAML (Rust yamllint)
hk = { version = "2.11.1", workflow = "release.yml" } # runner to orchestrate the hooks below
shellcheck = "0.11.0"                                 # lints shell scripts
shfmt = "3.14.1"                                      # formats shell scripts
tombi = "1.11.2"                                       # formats & lints TOML (mise.toml, *.toml)
cosign = "3.1.4"
rumdl = "0.3.2"

[hooks]
postinstall = "hk install --mise"
